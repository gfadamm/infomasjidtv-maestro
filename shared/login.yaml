appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow:
    commands:
      - extendedWaitUntil:
          visible: "Assalamulaikum"
          timeout: 20000
- repeat:
    times: 3
    commands:
      - swipe:
          direction: LEFT
- tapOn: "Sign in with Google"
- tapOn: ${TEST_EMAIL}
- extendedWaitUntil:
    visible: "Jadwal Shalat hari ini"
    timeout: 50000






    



